name: Attach installer zips to release

# Builds paperr-windows.zip / paperr-macos.zip / paperr-linux.zip from the
# one-click install/uninstall scripts and attaches them to the GitHub Release.
#
# Zipped because raw .cmd/.command/.sh downloads get flagged as dangerous file
# types by Chrome/Edge. Built with `git archive` rather than `zip` or
# Compress-Archive: the macOS/Linux scripts need their executable bit set, and
# that bit lives in git's tree object, not the filesystem — only git archive
# carries it into the zip's Unix permission metadata. A zip built by
# Compress-Archive silently drops it, and the script becomes a dead double-click
# until someone manually runs chmod +x.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and upload assets for (defaults to the latest release)"
        required: false

permissions:
  contents: write

jobs:
  installer-zips:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve target tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          elif [ -n "$EVENT_TAG" ]; then
            tag="$EVENT_TAG"
          else
            tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Build installer zips
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=zip -o dist/paperr-windows.zip HEAD -- \
            install/paperr-windows.cmd install/uninstall-windows.cmd
          git archive --format=zip -o dist/paperr-macos.zip HEAD -- \
            install/paperr-macos.command install/uninstall-macos.command
          git archive --format=zip -o dist/paperr-linux.zip HEAD -- \
            install/paperr-linux.sh install/uninstall-linux.sh

      # Guards against exactly the bug this pipeline replaced a manual step
      # for: a script committed without +x silently ships a zip that does
      # nothing on double-click. Fail the release rather than ship that quietly.
      - name: Verify the executable bit survived into the zips
        run: |
          set -euo pipefail
          check() {
            zip="$1"; entry="$2"
            line=$(zipinfo "$zip" "$entry")
            echo "$line"
            case "$line" in
              -rwx*) ;;
              *) echo "::error file=$entry::missing the executable bit in $zip: $line"; exit 1 ;;
            esac
          }
          check dist/paperr-macos.zip install/paperr-macos.command
          check dist/paperr-macos.zip install/uninstall-macos.command
          check dist/paperr-linux.zip install/paperr-linux.sh
          check dist/paperr-linux.zip install/uninstall-linux.sh

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.tag.outputs.tag }}" \
            dist/paperr-windows.zip dist/paperr-macos.zip dist/paperr-linux.zip \
            --repo "$GITHUB_REPOSITORY" --clobber
